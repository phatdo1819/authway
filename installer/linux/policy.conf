# The settings of the administrator for @PRODUCT@: one "Name = value" a line, 1 or 0. The service reads them at each
# request, the app at each login: no restart.

# 1: every user of this computer can add, rename and remove VPNs without the password of an administrator. 0: only the
# administrators can, the system asks for the password each time. A VPN can send all the traffic of the computer
# through its server and change its DNS servers: set it to 0 on a computer that other people use.
AllowUserImport = 1

# 0: the app never saves the passwords of the logins; the usernames stay.
# RememberPassword = 1
