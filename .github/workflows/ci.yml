# The checks of every push to main and every pull request, on Windows, macOS and Linux: clippy and the tests, for the
# build of the releases and for the test build (docs/building.md#tests), and the other processor of the packages. On
# Linux, the .deb and the .rpm too, built on Rocky Linux 9 as the releases are: the .deb installed on Ubuntu, its
# service started, a VPN added and removed; the .rpm installed on a clean Rocky Linux 9, for glibc and the
# dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch replaces the checks still running
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Rust of the CI, the one the code was last checked with: each release of Rust brings new lints of clippy, which
  # fail the build with -D warnings. Moving to a newer one is a change of its own, with the fixes its lints ask for.
  RUST: 1.96.0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            other_target: aarch64-pc-windows-msvc
          - os: macos-latest
            other_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install ${{ env.RUST }} --profile minimal --component clippy --no-self-update
          rustup default ${{ env.RUST }}
          rustup target add ${{ matrix.other_target }}

      # the login test listens on 127.0.0.2, which macOS doesn't have by itself
      - name: A second loopback address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy of the test build
        run: cargo clippy --all-targets --features testing -- -D warnings

      - name: Tests
        run: cargo test

      - name: Tests of the test build
        run: cargo test --features testing

      - name: The other processor
        run: cargo check --target ${{ matrix.other_target }}

  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install ${{ env.RUST }} --profile minimal --component clippy --no-self-update
          rustup default ${{ env.RUST }}
          rustup target add aarch64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy of the test build
        run: cargo clippy --all-targets --features testing -- -D warnings

      - name: Tests
        run: cargo test

      - name: Tests of the test build
        run: cargo test --features testing

      - name: The other processor
        run: cargo check --target aarch64-unknown-linux-gnu

  # The packages of the releases, built on RHEL 9 (Rocky Linux 9): a program needs the glibc of the system that builds
  # it, or a later one, and RHEL 9 has the oldest of the systems of the packages, 2.34
  packages:
    name: packages (rockylinux-9)
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # EPEL for dpkg, then the Rust of the CI with rustup: the script finds it
      - name: Rust
        run: |
          dnf install -y -q epel-release
          command -v curl >/dev/null || dnf install -y -q curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST }} --no-modify-path

      # the script installs what it needs: gcc, rpmbuild and dpkg
      - name: The packages
        run: sh tools/dist-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  deb:
    name: ubuntu-latest .deb
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages

      # the service as the package installs it: started by systemd, a VPN added and removed by root
      - name: The .deb installed
        run: |
          sudo apt-get install -y ./authway_*_amd64.deb
          systemctl is-active authway.service
          test -S /run/authway.sock
          key=$(head -c 32 /dev/urandom | base64)
          peer=$(head -c 32 /dev/urandom | base64)
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.103.1.2/24\n[Peer]\nPublicKey = %s\nAllowedIPs = 10.103.1.0/24\nEndpoint = 192.0.2.1:51820\n' "$key" "$peer" > ci.conf
          sudo authway --import ci.conf --name CI
          sudo test -f /var/lib/authway/tunnels/CI.conf
          sudo authway --remove CI
          sudo test ! -e /var/lib/authway/tunnels/CI.conf
          sudo cat /var/log/authway/service.log

  rpm:
    name: rockylinux-9 .rpm
    needs: packages
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages

      - name: The .rpm installed, with its dependencies
        run: |
          dnf install -y ./authway-*.x86_64.rpm
          rpm -ql authway
          authway --remove nothing || test $? -eq 1
